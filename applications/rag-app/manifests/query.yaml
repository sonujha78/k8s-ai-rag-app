apiVersion: apps/v1
kind: Deployment
metadata:
  name: query
  namespace: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query
  template:
    metadata:
      labels:
        app: query
    spec:
      containers:
        - name: query
          image: rag-query:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: OLLAMA_BASE_URL
              value: http://host.minikube.internal:11434
---
apiVersion: v1
kind: Service
metadata:
  name: query
  namespace: rag-app
  labels:
    app: query
spec:
  selector:
    app: query
  ports:
    - name: query-port
      port: 8001
      targetPort: 8001
