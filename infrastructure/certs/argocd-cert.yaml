apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rag-ui-tls
  namespace: rag-app
spec:
  secretName: rag-ui-tls-secret
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: rag-ui.local
  dnsNames:
    - rag-ui.local
    - localhost
